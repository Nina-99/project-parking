target-version = "py312"
line-length = 100

[lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "W",  # pycodestyle warnings
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
    "B",  # flake8-bugbear
]

ignore = ["I"]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"*/settings/*.py" = ["F403", "F401"]
