[project]
name = "parking"
version = "0.2.0"
description = "Smart parking system using computer vision — FastAPI + YOLOv26"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "python-multipart>=0.0.12,<1.0",
    # Operator session (httpOnly cookie)
    "pyjwt>=2.9,<3.0",
    # Database
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    # Sync driver for the Celery worker. The API stays on asyncpg; the worker
    # cannot use it, because asyncpg connections belong to the event loop that
    # created them and Celery tasks are not async.
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    # Task queue
    "celery[redis]>=5.4,<6.0",
    "redis>=5.1,<6.0",
    # Computer vision & ML
    "ultralytics>=8.4",
    "torch>=2.4,<3.0",
    "torchvision>=0.19,<1.0",
    "opencv-python-headless>=4.10,<5.0",
    # OCR
    "paddlepaddle>=3.0,<4.0",
    "paddleocr>=2.8,<3.0",
    # Utilities
    "pydantic-settings>=2.6,<3.0",
    "httpx>=0.28,<1.0",
    "numpy<2.0",
    "websockets>=13.0,<14.0",
    "lapx>=0.5.2",
    "tensorrt>=11.3.0.99",
    "onnx>=1.19",
    "onnxslim>=0.1.96",
    "onnxruntime-gpu>=1.30.0",
    "onnxscript>=0.7",
    "ml-dtypes>=0.5.0",
    "onnx-ir>=0.2.0",
]

[tool.uv]
# Resolve only for the interpreter we actually run (3.12). Without this, uv
# also solves for Python >=3.13, where newer ml_dtypes demands numpy>=2.1 and
# clashes with the numpy<2.0 pin that Paddle needs.
environments = [
    "python_version >= '3.12' and python_version < '3.13' and sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<6.0",
    "factory-boy>=3.3,<4.0",
    "httpx>=0.28,<1.0",
]
lint = ["ruff>=0.6,<1.0"]
typecheck = ["mypy>=1.11,<2.0"]

[tool.setuptools.packages.find]
include = ["backend*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are immutable defaults, not calls evaluated by the
# module. Without this, every `Depends`/`Query` default is flagged as B008.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.ruff.lint.per-file-ignores]
# The directory name is part of the runbook command (`python rtsp-capture/...`).
"rtsp-capture/__init__.py" = ["N999"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["frontend/", "rtsp-capture/"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
addopts = "--cov=backend/app --cov-report=term-missing"
markers = [
    "integration: needs a reachable PostgreSQL; skipped when there is none",
]

[tool.coverage.run]
source = ["backend"]
omit = ["*/tests/*", "*/__pycache__/*"]
