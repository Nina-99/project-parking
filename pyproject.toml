[project]
name = "parking"
version = "0.1.0"
description = "Smart parking system using computer vision"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6.0",
    "djangorestframework>=3.15,<4.0",
    "django-cors-headers>=4.4,<5.0",
    "django-environ>=0.11,<1.0",
    "psycopg2-binary>=2.9,<3.0",
    "celery[redis]>=5.4,<6.0",
    "redis>=5.1,<6.0",
    "ultralytics==8.3.0",
    "torch>=2.4,<3.0",
    "torchvision>=0.19,<1.0",
    "opencv-python>=4.10,<5.0",
    "gunicorn>=23.0,<24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-django>=4.9,<5.0",
    "pytest-cov>=5.0,<6.0",
    "factory-boy>=3.3,<4.0",
]
lint = [
    "ruff>=0.6,<1.0",
]
typecheck = [
    "mypy>=1.11,<2.0",
    "django-stubs>=5.1,<6.0",
    "djangorestframework-stubs>=3.15,<4.0",
]

[tool.setuptools.packages.find]
include = ["config*", "apps*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
