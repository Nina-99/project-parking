volumes:
  postgres_data:
  redis_data:

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parking-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://parking:parking@postgres:5432/parking
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:8000","http://127.0.0.1:5173","http://frontend:80"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
    command: >
      sh -c "uv run alembic -c backend/alembic.ini upgrade head &&
             uv run uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: parking-worker
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://parking:parking@postgres:5432/parking
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
    # Uncomment for GPU access:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    command: >
      sh -c "uv run celery -A backend.worker.celery_app worker --loglevel=info --concurrency=1"

  # Celery Beat: runs the retention schedule
  beat:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: parking-beat
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://parking:parking@postgres:5432/parking
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
    command: >
      sh -c "uv run celery -A backend.worker.celery_app beat --loglevel=info"

  postgres:
    image: postgres:16
    container_name: parking-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    env_file:
      - .env
    environment:
      POSTGRES_DB: parking
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: parking
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking -d parking"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: parking-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: parking-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - api
    environment:
      - VITE_API_URL=http://api:8000
